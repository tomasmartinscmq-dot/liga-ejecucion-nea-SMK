<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liga de Ejecución SMK NEA</title>
<script src="form_config.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600&display=swap');
:root{
  --r:#C8272D;--rd:#9E1E23;--n:#E8621A;
  --g:#2D7A3A;--gb:#E8F5EB;--rb:#FCEBEB;
  --bg:#F4F2EF;--card:#fff;--t:#1A1A18;--t2:#555;--t3:#999;
  --br:rgba(0,0,0,0.09);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;min-height:100%;background:var(--bg);font-family:'Barlow',sans-serif;color:var(--t);padding-bottom:50px;}
.hdr{background:linear-gradient(135deg,var(--rd),var(--r) 55%,var(--n));padding:22px 18px 24px;text-align:center;}
.hdr-badge{display:inline-block;background:rgba(255,255,255,.15);color:rgba(255,255,255,.9);font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:4px 12px;border-radius:20px;margin-bottom:10px;border:1px solid rgba(255,255,255,.2);}
.hdr h1{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:900;color:#fff;text-transform:uppercase;line-height:1.1;}
.hdr h1 span{color:rgba(255,255,255,.75);font-size:15px;font-weight:600;display:block;letter-spacing:3px;margin-top:3px;}
.hdr p{font-size:12px;color:rgba(255,255,255,.7);margin-top:6px;}
.pbar-wrap{background:var(--rd);padding:9px 18px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50;}
.pbar{flex:1;height:4px;background:rgba(255,255,255,.2);border-radius:2px;overflow:hidden;}
.pfill{height:100%;background:#fff;border-radius:2px;transition:width .3s;}
.ptxt{font-size:11px;color:rgba(255,255,255,.8);font-weight:700;font-family:'Barlow Condensed',sans-serif;white-space:nowrap;}
.steps{padding:14px;}
.step{display:none;}
.step.on{display:block;}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:10px;border:0.5px solid var(--br);box-shadow:0 1px 6px rgba(0,0,0,.05);}
.clabel{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--r);margin-bottom:5px;font-family:'Barlow Condensed',sans-serif;}
.ctitle{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;line-height:1.2;margin-bottom:4px;}
.cdesc{font-size:12px;color:var(--t2);line-height:1.5;margin-bottom:10px;}
.pts{display:inline-flex;align-items:center;background:linear-gradient(135deg,var(--r),var(--n));color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;padding:3px 10px;border-radius:20px;margin-bottom:12px;}
.ibox{background:#FFF8E6;border:1px solid #F0C040;border-radius:8px;padding:9px 12px;font-size:11px;color:#7A5800;margin-bottom:12px;line-height:1.6;white-space:pre-line;}
/* TABLA — scroll horizontal en celular */
.ref-table-wrap{width:100%;overflow-x:auto;margin-bottom:12px;-webkit-overflow-scrolling:touch;border-radius:8px;}
.ref-table{width:100%;border-collapse:collapse;font-size:10px;min-width:320px;}
.ref-table th{background:var(--r);color:#fff;padding:5px 6px;text-align:center;font-weight:700;font-size:9px;text-transform:uppercase;white-space:nowrap;}
.ref-table td{padding:5px 6px;text-align:center;border-bottom:0.5px solid #F0F0EB;color:var(--t2);white-space:nowrap;}
.ref-table tr:last-child td{border-bottom:none;}
.ref-table tr:nth-child(even) td{background:#F8F8F6;}
.ref-table td:first-child{text-align:left;font-weight:600;color:var(--t);}
select{width:100%;padding:15px 14px;border:1.5px solid var(--br);border-radius:10px;font-size:16px;font-family:'Barlow',sans-serif;color:var(--t);background:#fff;-webkit-appearance:none;appearance:none;outline:none;margin-bottom:10px;cursor:pointer;}
select:focus{border-color:var(--r);}
input[type=tel]{width:100%;padding:15px 14px;border:1.5px solid var(--br);border-radius:10px;font-size:16px;font-family:'Barlow',sans-serif;color:var(--t);background:#fff;-webkit-appearance:none;appearance:none;outline:none;margin-bottom:10px;}
input[type=tel]:focus{border-color:var(--r);}
textarea{width:100%;padding:12px 14px;border:1.5px solid var(--br);border-radius:10px;font-size:14px;font-family:'Barlow',sans-serif;color:var(--t);background:#fff;outline:none;resize:none;min-height:75px;margin-bottom:4px;}
textarea:focus{border-color:var(--r);}
/* OPCIONES MÚLTIPLES */
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
.opts2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.opt{display:flex;align-items:center;gap:12px;padding:14px 14px;border-radius:10px;border:2px solid var(--br);background:#fff;text-align:left;font-family:'Barlow',sans-serif;font-size:13px;font-weight:500;color:var(--t);width:100%;cursor:pointer;-webkit-appearance:none;appearance:none;transition:all .15s;}
.opt-ico{width:26px;height:26px;border-radius:50%;border:2px solid #DDD;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;}
.opt.sel{border-color:var(--g);background:#E8F5EB;}
.opt.sel .opt-ico{background:var(--g);border-color:var(--g);color:#fff;}
.opt.opt-none{border-color:#FFAAAA;background:#FFF5F5;padding:16px 14px;}
.opt.opt-none .opt-ico{border-color:#E24B4A;color:#E24B4A;}
.opt.opt-none span:last-child{font-weight:700;color:var(--r);font-size:14px;}
.opt.opt-none.sel{border-color:var(--r);background:#FCEBEB;}
.opt.opt-none.sel .opt-ico{background:var(--r);border-color:var(--r);color:#fff;}
/* SI/NO */
.sino{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.sib{padding:22px 10px;border-radius:14px;border:3px solid var(--br);background:#fff;font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:900;text-align:center;cursor:pointer;-webkit-appearance:none;appearance:none;width:100%;transition:all .15s;letter-spacing:.5px;}
.sib small{font-size:12px;font-weight:500;display:block;margin-top:4px;font-family:'Barlow',sans-serif;}
.sib.si{color:var(--g);border-color:#AADDAA;}
.sib.no{color:var(--r);border-color:#FFAAAA;}
.sib.si.sel{background:var(--gb);border-color:var(--g);box-shadow:0 3px 12px rgba(45,122,58,.25);}
.sib.no.sel{background:var(--rb);border-color:var(--r);box-shadow:0 3px 12px rgba(200,39,45,.25);}
.foto-lbl{font-size:11px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
.foto-badge{font-size:9px;padding:2px 7px;border-radius:10px;font-weight:700;}
.foto-badge.oblig{background:#FCEBEB;color:var(--r);}
.foto-badge.opcio{background:#E8F5EB;color:var(--g);}
.foto-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.foto-item{border-radius:10px;border:2px dashed #CCC;background:#F8F8F6;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;position:relative;min-height:88px;justify-content:center;}
.foto-item.oblig-slot{border-color:#FFAAAA;}
.foto-item.opcio-slot{border-color:#AADDAA;}
.foto-item.loaded{border-style:solid;border-color:var(--g);background:#F0FAF2;}
.foto-item input[type=file]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:0;}
.foto-item .ficon{font-size:22px;color:#BBB;}
.foto-item .ftxt{font-size:10px;color:#BBB;font-weight:600;text-transform:uppercase;letter-spacing:.4px;text-align:center;}
.foto-item.loaded .ficon{color:var(--g);}
.foto-item.loaded .ftxt{color:var(--g);}
.foto-fname{font-size:9px;color:var(--g);font-weight:600;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px;display:none;}
.foto-item.loaded .foto-fname{display:block;}
.foto-del{display:none;position:absolute;top:4px;right:4px;background:var(--r);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:11px;cursor:pointer;align-items:center;justify-content:center;z-index:10;padding:0;font-weight:700;}
.foto-item.loaded .foto-del{display:flex;}
.slot-label{position:absolute;top:5px;left:6px;font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
.oblig-slot .slot-label{color:#E24B4A;}
.opcio-slot .slot-label{color:var(--g);}
.com-lbl{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;margin-top:8px;}
.nav{display:grid;gap:10px;margin-top:4px;}
.nav.two{grid-template-columns:1fr 1fr;}
.nav.one{grid-template-columns:1fr;}
.nbtn{padding:16px;border-radius:12px;border:none;font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;letter-spacing:.5px;cursor:pointer;text-transform:uppercase;-webkit-appearance:none;appearance:none;width:100%;display:block;text-align:center;touch-action:manipulation;}
.nbtn-back{background:#EEECEA;color:var(--t2);}
.nbtn-next{background:linear-gradient(135deg,var(--r),var(--n));color:#fff;}
.nbtn-send{background:linear-gradient(135deg,var(--g),#3A9E4A);color:#fff;}
.emsg{background:#FCEBEB;border:1px solid #E24B4A;border-radius:8px;padding:10px 12px;font-size:12px;color:#A32D2D;margin-bottom:10px;display:none;font-weight:500;}
.emsg.on{display:block;}
.sc-card{border-radius:16px;padding:28px 20px;text-align:center;margin-bottom:12px;color:#fff;}
.sc-num{font-family:'Barlow Condensed',sans-serif;font-size:72px;font-weight:900;line-height:1;}
.sc-lbl{font-size:14px;opacity:.85;margin-top:4px;}
.sc-st{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;margin-top:10px;text-transform:uppercase;}
.vsum{background:#fff;border-radius:12px;overflow:hidden;margin-bottom:10px;border:.5px solid var(--br);}
.vrow{display:flex;align-items:center;justify-content:space-between;padding:9px 13px;border-bottom:.5px solid #F0F0EB;font-size:12px;}
.vrow:last-child{border-bottom:none;}
.vname{font-weight:600;flex:1;}
.vpts{font-size:10px;color:var(--t3);margin:0 8px;}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
.ov.on{display:flex;}
.spin{width:48px;height:48px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
.spin-txt{color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;}
.ok-card{background:var(--g);border-radius:16px;padding:28px 20px;text-align:center;color:#fff;margin-bottom:12px;}
.ok-card h2{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:900;margin-bottom:6px;}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-badge">⚽ 2026</div>
  <h1>Liga de Ejecución<span>SMK · REGIÓN NEA</span></h1>
  <p>Formulario de relevamiento semanal</p>
</div>
<div class="pbar-wrap" id="pbarWrap">
  <div class="pbar"><div class="pfill" id="pf" style="width:0%"></div></div>
  <div class="ptxt" id="pt">0 / 0</div>
</div>
<div class="steps" id="stepsContainer"></div>
<div class="ov" id="ov"><div class="spin"></div><div class="spin-txt">Enviando...</div></div>

<script>
(function(){
'use strict';

var C = FORM_CONFIG;
var VARS = C.variables;
var VAR_OFFSET = 2;
var STEP_RESULT = VARS.length + VAR_OFFSET;
var STEP_OK = STEP_RESULT + 1;

var multi = {};
var sino = {};
var fotos = {};
var cur = 0;

var ICONS = {
  'Quilmes Mundial':'🍺','Stella Pure Gold':'⭐','Michelob Ultra':'🎯','Stella 710ml no retornable':'🍾',
  'Latones':'🥫','Above Core':'⬆️','Balanced Choices':'⚖️','Litro Core Value o Brahma 354':'📦',
  'Carnicería':'🥩','Fiambrería/Importados':'🧀','Snacks':'🍿','Comidas preparadas':'🍱',
  'Otros Alcoholes':'🍷','Sin Gluten':'🌾','Congelados':'❄️','Saludables':'💚',
  'Gaseosas Single Serve':'🥤','Gatorade':'⚡','Premium':'🏆','Super Premium':'⭐',
  'Michelob':'🎯','Otros CZA':'🍺','Ninguno':'✗','Ninguna':'✗'
};
function ico(v){ return ICONS[v] || '•'; }

// ── SCROLL al inicio del step (no al tope de página) ─────────────────────────
function scrollToStep(){
  var el = document.getElementById('stepsContainer');
  if(!el) return;
  var top = el.getBoundingClientRect().top + window.pageYOffset - 8;
  window.scrollTo({top: top, behavior: 'smooth'});
}

// ── BUILD HTML ────────────────────────────────────────────────────────────────
function build(){
  var html = '';

  // Step 0: Nombre
  html += '<div class="step on" id="s0">';
  html += '<div class="card"><div class="clabel">Identificación</div>';
  html += '<div class="ctitle">¿Cuál es tu nombre?</div>';
  html += '<div class="cdesc">Seleccioná tu nombre de la lista</div>';
  html += '<select id="inp-nombre"><option value="">— Seleccioná tu nombre —</option>';
  C.repositores.forEach(function(r){ html += '<option>'+r+'</option>'; });
  html += '</select>';
  html += '<div class="emsg" id="e0">Seleccioná tu nombre.</div></div>';
  html += '<div class="nav one"><button class="nbtn nbtn-next" id="btn-0-next">Continuar →</button></div>';
  html += '</div>';

  // Step 1: PDV
  html += '<div class="step" id="s1">';
  html += '<div class="card"><div class="clabel">Punto de Venta</div>';
  html += '<div class="ctitle">Código del PDV</div>';
  html += '<div class="cdesc">Ingresá el código numérico del supermercado</div>';
  html += '<input type="tel" id="inp-pdv" placeholder="Ej: 316727">';
  html += '<div class="emsg" id="e1">Ingresá el código del PDV.</div></div>';
  html += '<div class="nav two"><button class="nbtn nbtn-back" id="btn-1-back">← Volver</button>';
  html += '<button class="nbtn nbtn-next" id="btn-1-next">Continuar →</button></div>';
  html += '</div>';

  // Steps de variables
  VARS.forEach(function(v, vi){
    var step = vi + VAR_OFFSET;
    var varNum = vi + 1;
    html += '<div class="step" id="s'+step+'">';
    html += '<div class="card">';
    html += '<div class="clabel">Variable '+varNum+' de '+VARS.length+'</div>';
    html += '<div class="ctitle">'+v.label+'</div>';
    html += '<div class="pts">⚡ '+v.pts+' puntos</div>';
    if(v.infoBox) html += '<div class="ibox">'+v.infoBox.replace(/\n/g,'<br>')+'</div>';

    // Tablas de referencia
    if(v.key==='facingcza'){
      html += '<div class="ref-table-wrap"><table class="ref-table"><tr><th>Cadena</th><th>Target FS</th></tr>';
      html += '<tr><td>Carrefour Hiper / Maxi</td><td>65%</td></tr>';
      html += '<tr><td>Libertad</td><td>63%</td></tr>';
      html += '<tr><td>Changomas / Hiper Changomas</td><td>60%</td></tr>';
      html += '<tr><td>VEA</td><td>59%</td></tr>';
      html += '<tr><td>La Anónima</td><td>75%</td></tr>';
      html += '</table></div>';
    }
    if(v.key==='planograma'){
      html += '<div class="ref-table-wrap"><table class="ref-table">';
      html += '<tr><th>Cadena</th><th>Quilmes</th><th>Brahma</th><th>Andes</th><th>Stella</th><th>Corona</th><th>Resto</th></tr>';
      html += '<tr><td>Carrefour</td><td>18%</td><td>17%</td><td>7%</td><td>10%</td><td>12%</td><td>35%</td></tr>';
      html += '<tr><td>Libertad</td><td>13%</td><td>10%</td><td>11%</td><td>16%</td><td>21%</td><td>29%</td></tr>';
      html += '<tr><td>VEA</td><td>17%</td><td>14%</td><td>13%</td><td>13%</td><td>18%</td><td>25%</td></tr>';
      html += '<tr><td>La Anónima</td><td>9%</td><td>14%</td><td>19%</td><td>14%</td><td>11%</td><td>34%</td></tr>';
      html += '<tr><td>Chango Mas</td><td>19%</td><td>11%</td><td>17%</td><td>9%</td><td>8%</td><td>36%</td></tr>';
      html += '</table></div>';
    }

    // Opciones
    if(v.tipo==='multi'){
      var gridClass = v.opciones.length > 4 ? 'opts2' : 'opts';
      html += '<div class="'+gridClass+'" id="og-'+v.key+'">';
      v.opciones.forEach(function(op){
        html += '<button class="opt" data-g="'+v.key+'" data-v="'+op+'" data-step="'+step+'">';
        html += '<span class="opt-ico">'+ico(op)+'</span><span>'+op+'</span></button>';
      });
      var noneLabel = v.noneValue==='Ninguna'?'Ninguna':'Ninguno ejecutado';
      var noneStyle = v.opciones.length>4?' style="grid-column:1/-1"':'';
      html += '<button class="opt opt-none" data-g="'+v.key+'" data-v="'+v.noneValue+'" data-step="'+step+'"'+noneStyle+'>';
      html += '<span class="opt-ico">✗</span><span>'+noneLabel+'</span></button>';
      html += '</div>';
    } else {
      html += '<div class="sino" id="sg-'+v.key+'">';
      html += '<button class="sib si" data-k="'+v.key+'" data-v="SI" data-step="'+step+'">✓ SI<small>Cumple</small></button>';
      html += '<button class="sib no" data-k="'+v.key+'" data-v="NO" data-step="'+step+'">✗ NO<small>No cumple</small></button>';
      html += '</div>';
    }

    html += '<div class="emsg" id="e'+step+'">Completá este campo para continuar.</div>';
    html += '</div>';

    // Card fotos + comentario
    html += '<div class="card">';
    html += '<div class="foto-lbl">📷 Evidencia ';
    html += '<span class="foto-badge oblig" id="foto-badge-'+step+'">1 obligatoria</span></div>';
    html += '<div class="foto-grid">';
    html += '<div class="foto-item oblig-slot" id="fi-'+step+'-0">';
    html += '<span class="slot-label">Obligatoria</span>';
    html += '<input type="file" accept="image/*" data-step="'+step+'" data-idx="0">';
    html += '<span class="ficon">📷</span><span class="ftxt">Foto 1</span>';
    html += '<button class="foto-del" data-step="'+step+'" data-idx="0">✕</button>';
    html += '<div class="foto-fname" id="fn-'+step+'-0"></div></div>';
    html += '<div class="foto-item opcio-slot" id="fi-'+step+'-1">';
    html += '<span class="slot-label">Opcional</span>';
    html += '<input type="file" accept="image/*" data-step="'+step+'" data-idx="1">';
    html += '<span class="ficon">📷</span><span class="ftxt">Foto 2</span>';
    html += '<button class="foto-del" data-step="'+step+'" data-idx="1">✕</button>';
    html += '<div class="foto-fname" id="fn-'+step+'-1"></div></div>';
    html += '</div>';
    html += '<div class="emsg" id="ef-'+step+'">La foto es obligatoria.</div>';
    html += '<div class="com-lbl">Comentario <span style="font-weight:400;font-size:9px">(opcional)</span></div>';
    html += '<textarea id="com-'+step+'" placeholder="Observaciones, propuestas..."></textarea>';
    html += '</div>';

    html += '<div class="nav two">';
    html += '<button class="nbtn nbtn-back" id="btn-'+step+'-back">← Volver</button>';
    var nextLabel = step===STEP_RESULT-1?'Ver resultado →':'Continuar →';
    html += '<button class="nbtn nbtn-next" id="btn-'+step+'-next">'+nextLabel+'</button>';
    html += '</div></div>';
  });

  // Resultado
  html += '<div class="step" id="s'+STEP_RESULT+'">';
  html += '<div class="sc-card" id="scCard"><div class="sc-num" id="scNum">0</div>';
  html += '<div class="sc-lbl">puntos sobre 100</div><div class="sc-st" id="scSt">—</div></div>';
  html += '<div class="card"><div class="clabel">Resumen</div><div class="vsum" id="vsum"></div></div>';
  html += '<div class="emsg" id="e-send"></div>';
  html += '<div class="nav two">';
  html += '<button class="nbtn nbtn-back" id="btn-'+STEP_RESULT+'-back">← Revisar</button>';
  html += '<button class="nbtn nbtn-send" id="btn-'+STEP_RESULT+'-send">✓ Enviar</button>';
  html += '</div></div>';

  // Éxito
  html += '<div class="step" id="s'+STEP_OK+'">';
  html += '<div class="ok-card"><div style="font-size:48px;margin-bottom:10px">✅</div>';
  html += '<h2>¡Enviado!</h2><p>Relevamiento guardado correctamente.</p></div>';
  html += '<div class="card" style="text-align:center"><div class="clabel">Tu puntaje</div>';
  html += '<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:56px;font-weight:900;color:var(--r)" id="finalNum">—</div>';
  html += '<div style="font-size:12px;color:var(--t3)">puntos sobre 100</div></div>';
  html += '<div class="nav one"><button class="nbtn nbtn-next" id="btn-'+STEP_OK+'-new">Nuevo relevamiento</button></div>';
  html += '</div>';

  document.getElementById('stepsContainer').innerHTML = html;
  document.getElementById('pt').textContent = '0 / '+STEP_RESULT;
}

// ── NAVEGACIÓN ────────────────────────────────────────────────────────────────
function goTo(n){
  document.getElementById('s'+cur).classList.remove('on');
  cur = n;
  document.getElementById('s'+cur).classList.add('on');
  document.getElementById('pf').style.width = Math.round(cur/STEP_RESULT*100)+'%';
  document.getElementById('pt').textContent = cur+' / '+STEP_RESULT;
  scrollToStep();
}

function next(from){
  if(!validate(from)) return;
  if(from===STEP_RESULT-1) buildResult();
  goTo(from+1);
}
function back(from){ goTo(from-1); }

// ── VALIDACIÓN ────────────────────────────────────────────────────────────────
function showE(id,msg){var el=document.getElementById(id);if(el){el.textContent=msg;el.classList.add('on');}}
function hideE(id){var el=document.getElementById(id);if(el)el.classList.remove('on');}

function isNegativo(step){
  var vi=step-VAR_OFFSET;
  if(vi<0||vi>=VARS.length) return false;
  var v=VARS[vi];
  if(v.tipo==='sino') return sino[v.key]==='NO';
  var sel=multi[v.key]||[];
  return sel.length===0||sel.every(function(x){return x===v.noneValue;});
}

function validate(step){
  var ok=true;
  if(step===0){
    if(!document.getElementById('inp-nombre').value){showE('e0','Seleccioná tu nombre.');ok=false;}
    else hideE('e0');
  }
  if(step===1){
    if(!document.getElementById('inp-pdv').value.trim()){showE('e1','Ingresá el código del PDV.');ok=false;}
    else hideE('e1');
  }
  var vi=step-VAR_OFFSET;
  if(vi>=0&&vi<VARS.length){
    var v=VARS[vi];
    if(v.tipo==='multi'){
      if(!(multi[v.key]&&multi[v.key].length)){showE('e'+step,'Seleccioná al menos una opción.');ok=false;}
      else hideE('e'+step);
    } else {
      if(!sino[v.key]){showE('e'+step,'Respondé SI o NO.');ok=false;}
      else hideE('e'+step);
    }
    if(!isNegativo(step)){
      if(!(fotos[step]&&fotos[step][0])){showE('ef-'+step,'La foto es obligatoria.');ok=false;}
      else hideE('ef-'+step);
    } else hideE('ef-'+step);
  }
  return ok;
}

function updateFotoCard(step){
  var neg=isNegativo(step);
  var badge=document.getElementById('foto-badge-'+step);
  var slot0=document.getElementById('fi-'+step+'-0');
  if(!slot0) return;
  if(neg){
    if(badge){badge.textContent='Opcional';badge.className='foto-badge opcio';}
    slot0.classList.remove('oblig-slot');slot0.classList.add('opcio-slot');
    var lbl=slot0.querySelector('.slot-label');if(lbl)lbl.textContent='Opcional';
    var ftxt=slot0.querySelector('.ftxt');if(ftxt&&!slot0.classList.contains('loaded'))ftxt.textContent='Foto opcional';
  } else {
    if(badge){badge.textContent='1 obligatoria';badge.className='foto-badge oblig';}
    slot0.classList.remove('opcio-slot');slot0.classList.add('oblig-slot');
    var lbl=slot0.querySelector('.slot-label');if(lbl)lbl.textContent='Obligatoria';
    var ftxt=slot0.querySelector('.ftxt');if(ftxt&&!slot0.classList.contains('loaded'))ftxt.textContent='Foto 1';
  }
}

// ── OPCIONES MÚLTIPLES ────────────────────────────────────────────────────────
function handleOpt(btn){
  var g=btn.getAttribute('data-g');
  var v=btn.getAttribute('data-v');
  var step=parseInt(btn.getAttribute('data-step'));
  var vi=step-VAR_OFFSET;
  var vdef=VARS[vi];
  var none=vdef?vdef.noneValue:'Ninguno';
  if(!multi[g])multi[g]=[];
  var arr=multi[g];
  var isNone=(v===none);
  if(isNone){
    multi[g]=arr.indexOf(v)>-1?[]:[v];
  } else {
    var ni=arr.indexOf(none);if(ni>-1)arr.splice(ni,1);
    var i=arr.indexOf(v);if(i>-1)arr.splice(i,1);else arr.push(v);
  }
  var container=btn.parentElement;
  container.querySelectorAll('.opt').forEach(function(b){
    var bv=b.getAttribute('data-v');
    var sel=(multi[g]||[]).indexOf(bv)>-1;
    b.classList.toggle('sel',sel);
    b.querySelector('.opt-ico').textContent=sel?'✓':ico(bv);
  });
  updateFotoCard(step);
}

// ── SI/NO ────────────────────────────────────────────────────────────────────
function handleSino(btn){
  var k=btn.getAttribute('data-k');
  var v=btn.getAttribute('data-v');
  var step=parseInt(btn.getAttribute('data-step'));
  sino[k]=v;
  var sg=document.getElementById('sg-'+k);
  if(sg)sg.querySelectorAll('.sib').forEach(function(b){b.classList.toggle('sel',b.getAttribute('data-v')===v);});
  updateFotoCard(step);
}

// ── FOTOS con compresión ──────────────────────────────────────────────────────
function comprimirFoto(file, callback){
  var maxW=1200, maxH=1200, quality=0.7;
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var w=img.width, h=img.height;
      if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
      if(h>maxH){w=Math.round(w*maxH/h);h=maxH;}
      var canvas=document.createElement('canvas');
      canvas.width=w;canvas.height=h;
      var ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,w,h);
      callback(canvas.toDataURL('image/jpeg',quality));
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function handleFoto(input){
  var step=parseInt(input.getAttribute('data-step'));
  var idx=parseInt(input.getAttribute('data-idx'));
  var file=input.files[0];if(!file)return;
  var item=document.getElementById('fi-'+step+'-'+idx);
  var fnEl=document.getElementById('fn-'+step+'-'+idx);
  comprimirFoto(file,function(base64){
    if(!fotos[step])fotos[step]={};
    fotos[step][idx]=base64;
    item.classList.add('loaded');
    item.querySelector('.ficon').textContent='✅';
    item.querySelector('.ftxt').textContent='Cargada';
    if(fnEl){var name=file.name.length>18?file.name.slice(0,17)+'...':file.name;fnEl.textContent=name;}
    hideE('ef-'+step);
  });
}

function handleDel(btn){
  var step=parseInt(btn.getAttribute('data-step'));
  var idx=parseInt(btn.getAttribute('data-idx'));
  var item=document.getElementById('fi-'+step+'-'+idx);
  if(fotos[step])delete fotos[step][idx];
  item.classList.remove('loaded');
  item.querySelector('.ficon').textContent='📷';
  var isOblig=item.classList.contains('oblig-slot');
  item.querySelector('.ftxt').textContent=isOblig?'Foto '+(idx+1):'Foto opcional';
  var fnEl=document.getElementById('fn-'+step+'-'+idx);if(fnEl)fnEl.textContent='';
  var fi=item.querySelector('input[type=file]');try{if(fi)fi.value='';}catch(e){}
}

// ── SCORE ────────────────────────────────────────────────────────────────────
function calcScore(){
  var pdv=document.getElementById('inp-pdv').value.trim();
  var info=C.pdvs[pdv];
  var tipo=info?info.tipo:'super';
  var total=0;var res={};
  VARS.forEach(function(v){
    var ok=false;
    if(v.tipo==='multi'){
      var sel=(multi[v.key]||[]).filter(function(x){return x!==v.noneValue;});
      var min=tipo==='hiper'?(v.minHiper||1):(v.minSuper||1);
      ok=sel.length>=min;
    } else {
      ok=sino[v.key]==='SI';
    }
    res[v.key]=ok;
    if(ok)total+=v.pts;
  });
  return {total:total,res:res};
}

function buildResult(){
  var r=calcScore();
  var hi=C.umbrales.alto,mid=C.umbrales.medio;
  document.getElementById('scNum').textContent=r.total;
  document.getElementById('finalNum').textContent=r.total;
  var st,bg;
  if(r.total>=hi){st='Excelente ejecución ✅';bg='linear-gradient(135deg,#1E6B2A,#2D9A3E)';}
  else if(r.total>=mid){st='Ejecución aceptable ⚠️';bg='linear-gradient(135deg,#8A3A00,#C85A10)';}
  else{st='Necesita mejora urgente ❌';bg='linear-gradient(135deg,#9E1E23,#C8272D)';}
  document.getElementById('scSt').textContent=st;
  document.getElementById('scCard').style.background=bg;
  document.getElementById('vsum').innerHTML=VARS.map(function(v){
    return '<div class="vrow"><span class="vname">'+v.label+'</span><span class="vpts">'+v.pts+'pts</span><span style="font-size:18px">'+(r.res[v.key]?'✅':'❌')+'</span></div>';
  }).join('');
}

// ── SUBMIT ────────────────────────────────────────────────────────────────────
function submitForm(){
  var r=calcScore();
  var pdv=document.getElementById('inp-pdv').value.trim();
  var info=C.pdvs[pdv]||{};
  var now=new Date();

  var row=[
    now.toISOString(),
    document.getElementById('inp-nombre').value,
    pdv,info.bandera||'—',info.ciudad||'—',info.tipo||'—'
  ];
  VARS.forEach(function(v){
    if(v.tipo==='multi')row.push((multi[v.key]||[]).join(', ')||v.noneValue);
    else row.push(sino[v.key]||'NO');
  });
  VARS.forEach(function(v){row.push(r.res[v.key]?'SI':'NO');});
  row.push(r.total);
  VARS.forEach(function(v,vi){
    var el=document.getElementById('com-'+(vi+VAR_OFFSET));
    row.push(el?el.value.trim():'');
  });

  // Construir objeto de fotos — ya comprimidas en handleFoto
  var fotosToSend={};
  VARS.forEach(function(v,vi){
    var step=vi+VAR_OFFSET;
    if(fotos[step]){
      fotosToSend[step]={};
      if(fotos[step][0])fotosToSend[step][0]=fotos[step][0];
      if(fotos[step][1])fotosToSend[step][1]=fotos[step][1];
    }
  });

  document.getElementById('ov').classList.add('on');
  fetch(C.scriptUrl,{
    method:'POST',mode:'no-cors',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({sheetId:C.sheetId,row:row,fotos:fotosToSend})
  }).then(function(){
    document.getElementById('ov').classList.remove('on');
    goTo(STEP_OK);
  }).catch(function(){
    document.getElementById('ov').classList.remove('on');
    var e=document.getElementById('e-send');
    e.textContent='Error al enviar. Verificá tu conexión.';
    e.classList.add('on');
  });
}

// ── RESET ────────────────────────────────────────────────────────────────────
function resetForm(){
  multi={};sino={};fotos={};
  document.getElementById('inp-nombre').value='';
  document.getElementById('inp-pdv').value='';
  document.querySelectorAll('.opt.sel').forEach(function(b){b.classList.remove('sel');});
  document.querySelectorAll('.sib.sel').forEach(function(b){b.classList.remove('sel');});
  document.querySelectorAll('.foto-item.loaded').forEach(function(item){
    item.classList.remove('loaded');
    var fi=item.querySelector('.ficon');if(fi)fi.textContent='📷';
    var ft=item.querySelector('.ftxt');if(ft)ft.textContent=item.classList.contains('oblig-slot')?'Foto 1':'Foto opcional';
  });
  document.querySelectorAll('.foto-fname').forEach(function(el){el.textContent='';});
  document.querySelectorAll('input[type=file]').forEach(function(i){try{i.value='';}catch(e){}});
  document.querySelectorAll('textarea').forEach(function(t){t.value='';});
  document.querySelectorAll('.emsg.on').forEach(function(e){e.classList.remove('on');});
  for(var s=VAR_OFFSET;s<STEP_RESULT;s++)updateFotoCard(s);
  goTo(0);
}

// ── BIND EVENTOS ─────────────────────────────────────────────────────────────
function addTap(el,fn){
  if(!el)return;
  el.addEventListener('click',function(e){e.preventDefault();fn();});
  el.addEventListener('touchend',function(e){e.preventDefault();fn();},{passive:false});
}

function bindAll(){
  addTap(document.getElementById('btn-0-next'),function(){next(0);});
  addTap(document.getElementById('btn-1-back'),function(){back(1);});
  addTap(document.getElementById('btn-1-next'),function(){next(1);});
  VARS.forEach(function(v,vi){
    var step=vi+VAR_OFFSET;
    addTap(document.getElementById('btn-'+step+'-back'),function(){back(step);});
    addTap(document.getElementById('btn-'+step+'-next'),function(){next(step);});
  });
  addTap(document.getElementById('btn-'+STEP_RESULT+'-back'),function(){back(STEP_RESULT);});
  addTap(document.getElementById('btn-'+STEP_RESULT+'-send'),submitForm);
  addTap(document.getElementById('btn-'+STEP_OK+'-new'),resetForm);
  document.querySelectorAll('.opt').forEach(function(btn){
    addTap(btn,function(){handleOpt(btn);});
  });
  document.querySelectorAll('.sib').forEach(function(btn){
    addTap(btn,function(){handleSino(btn);});
  });
  document.querySelectorAll('input[type=file]').forEach(function(input){
    input.addEventListener('change',function(){handleFoto(input);});
  });
  document.querySelectorAll('.foto-del').forEach(function(btn){
    btn.addEventListener('click',function(e){e.stopPropagation();e.preventDefault();handleDel(btn);});
    btn.addEventListener('touchend',function(e){e.stopPropagation();e.preventDefault();handleDel(btn);},{passive:false});
  });
}

build();
bindAll();

})();
</script>
